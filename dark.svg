<image href="assets/my-photo.jpg" x="39" y="89" width="508" height="472" preserveAspectRatio="xMidYMid slice"/>
<rect x="39" y="89" width="508" height="472" fill="#5b050a" opacity=".10"/>

<!-- Brand of Sacrifice badge -->
