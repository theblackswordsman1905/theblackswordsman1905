<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#030408"/><stop offset="1" stop-color="#0c090d"/>
 </linearGradient>
 <pattern id="grid" width="40" height="32" patternUnits="userSpaceOnUse">
   <path d="M40 0H0V32" fill="none" stroke="#17151b" stroke-width="1"/>
 </pattern>
 <linearGradient id="scan" x1="0" x2="1">
   <stop stop-color="#4b060b" stop-opacity="0"/>
   <stop offset=".5" stop-color="#ff2020" stop-opacity=".9"/>
   <stop offset="1" stop-color="#4b060b" stop-opacity="0"/>
 </linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .m{font-family:monospace}.red{fill:#ff2020}.white{fill:#f3f3f3}.muted{fill:#85838d}
  .small{font-size:12px}.body{font-size:13px}.head{font-size:21px;font-weight:700}
  @keyframes scan {0%{transform:translateY(0)}100%{transform:translateY(430px)}}
  .scanner{animation:scan 3.2s linear infinite}
  @keyframes pulse {0%,100%{opacity:.35}50%{opacity:1}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
 </style>
</defs>

<rect width="1200" height="620" rx="18" fill="url(#bg)"/>
<rect x="2" y="2" width="1196" height="616" rx="18" fill="url(#grid)" stroke="#8b1118" stroke-width="2"/>
<line x1="10" y1="48" x2="1190" y2="48" stroke="#421116"/>
<circle cx="28" cy="25" r="5" fill="#ff4040"/><circle cx="45" cy="25" r="5" fill="#d6a33e"/><circle cx="62" cy="25" r="5" fill="#55c878"/>
